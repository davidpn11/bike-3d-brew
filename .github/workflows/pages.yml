name: Publish site

# Keeps https://davidpn11.github.io/bike-3d-brew/ (gh-pages, deploy from branch) in step with
# the stack tip (see AGENTS.md): the newest open, non-draft PR whose head no other open PR uses as its base,
# or develop when nothing is open. While the stack waits for review, develop is far behind, so
# publishing only develop would leave the site weeks stale. tools/publish-pages.sh only replaces
# the main site and leaves PR previews in /pr/.
on:
  push:
    branches: [develop, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  # Its own job with no concurrency group: a push to a non-tip branch must not cancel a running publish.
  tip:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.tip.outputs.publish }}
    steps:
      - name: Is this branch the stack tip?
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,headRefName,baseRefName,isDraft > prs.json
          tip=$(node -e '
            // Drafts are claims still being built: they neither publish nor hide the PR below them.
            const prs = require("./prs.json").filter((p) => !p.isDraft);
            const bases = new Set(prs.map((p) => p.baseRefName));
            const leaves = prs.filter((p) => !bases.has(p.headRefName)).sort((a, b) => b.number - a.number);
            console.log(leaves[0]?.headRefName ?? "develop");')
          echo "Stack tip: $tip, pushed: $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "publish=$([ "$tip" = "$BRANCH" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  publish:
    needs: tip
    if: needs.tip.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer tip push supersedes a running publish. The script refetches gh-pages and retries
    # when another writer pushes first.
    concurrency:
      group: pages-main
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/docs/bun.lock') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun install --cwd apps/docs --frozen-lockfile
      # Pushes go through the checkout's token; the commit needs an author.
      - run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tools/publish-pages.sh --source "${{ github.ref_name }}"
