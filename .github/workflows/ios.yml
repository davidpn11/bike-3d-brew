name: iOS build

# Compiles the capture app against the device SDK without signing, so Swift changes
# made from Linux cloud sessions are type-checked by a real toolchain.
on:
  pull_request:
    paths: ['apps/ios/**', '.github/workflows/ios.yml']
  push:
    branches: [develop]
    paths: ['apps/ios/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - run: brew install xcodegen
      - name: Generate project
        working-directory: apps/ios
        run: xcodegen generate
      - name: Build (unsigned, generic iOS device)
        working-directory: apps/ios
        run: |
          xcodebuild -project BikeCapture.xcodeproj -scheme BikeCapture -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | tail -50
          test "${PIPESTATUS[0]}" -eq 0
